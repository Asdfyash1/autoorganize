[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoorganize"
version = "1.0.0"
description = "A smart CLI tool to automatically organize files in any directory by type, date, or custom rules"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Yashwanth", email = "yashgfghdd@gmail.com"},
]
keywords = ["cli", "file-organizer", "automation", "productivity", "file-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Utilities",
]
dependencies = [
    "rich>=13.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "watchdog>=3.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/Asdfyash1/autoorganize"
Repository = "https://github.com/Asdfyash1/autoorganize"
Issues = "https://github.com/Asdfyash1/autoorganize/issues"

[project.scripts]
autoorganize = "autoorganize.cli:main"

[tool.setuptools.packages.find]
include = ["autoorganize*"]
